name: Clean Architecture example

on:
  pull_request:
    paths:
      - "examples/clean-architecture/**"
      - ".github/workflows/clean-architecture-example.yml"
  push:
    paths:
      - "examples/clean-architecture/**"
      - ".github/workflows/clean-architecture-example.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stage:
          - stage-01
          - stage-02

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore examples/clean-architecture/${{ matrix.stage }}/Teaching.CleanArchitecture.${{ matrix.stage == 'stage-01' && 'Stage01' || 'Stage02' }}.csproj

      - name: Build
        run: dotnet build examples/clean-architecture/${{ matrix.stage }}/Teaching.CleanArchitecture.${{ matrix.stage == 'stage-01' && 'Stage01' || 'Stage02' }}.csproj --configuration Release --no-restore
