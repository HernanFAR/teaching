name: Documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure optional account backend
        env:
          TDIDACTA_SUPABASE_URL: ${{ vars.TDIDACTA_SUPABASE_URL }}
          TDIDACTA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TDIDACTA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "supabaseUrl": os.environ.get("TDIDACTA_SUPABASE_URL", ""),
              "supabasePublishableKey": os.environ.get("TDIDACTA_SUPABASE_PUBLISHABLE_KEY", ""),
          }

          Path("docs/javascripts/auth-config.js").write_text(
              "window.TDIDACTA_AUTH_CONFIG = Object.freeze(" + json.dumps(config) + ");\n",
              encoding="utf-8",
          )
          PY

      - name: Build site
        run: zensical build --strict --clean

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
