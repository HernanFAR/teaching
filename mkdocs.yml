site_name: Teaching
site_description: Lecciones y guías para entender conceptos de ingeniería de software desde los problemas que los hacen necesarios.
site_url: https://hernanfar.github.io/teaching/
repo_url: https://github.com/HernanFAR/teaching
repo_name: HernanFAR/teaching

theme:
  name: material
  custom_dir: overrides
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Cómo enseñamos: about/how-we-teach.md
  - Lecciones:
      - lessons/index.md
      - Clean Architecture:
          - lessons/clean-architecture/index.md
          - Instrucciones de generación: lessons/clean-architecture/generation-instructions.md
  - Guías:
      - guides/index.md
  - Apoyar:
      - support/index.md
      - Generar un peso: support/generar-un-peso.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  support:
    one_time:
      provider: "Buy Me a Coffee"
      url: "https://buymeacoffee.com/hernanfar"
    recurring:
      provider: "Buy Me a Coffee Monthly Support"
      url: "https://buymeacoffee.com/hernanfar"
    voluntary_ad:
      enabled: false
      sponsor_name: ""
      sponsor_url: ""
      headline: ""
      message: ""

extra_css:
  - stylesheets/extra.css
